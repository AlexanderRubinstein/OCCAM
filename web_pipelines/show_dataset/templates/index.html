<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
            margin-top: 20px;
        }
        .container form {
            margin-bottom: 20px;
        }
        .grid-container {
            display: grid;
            /* grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); */
            grid-template-columns: repeat(auto-fill, minmax(1000px, 1fr));
            gap: 10px;
            padding: 20px;
            justify-items: center;
            align-items: center;
        }
        .gallery {
            border: 2px solid #ddd;
            border-radius: 5px;
            overflow: hidden;
        }
        .gallery img {
            width: 100%;
            height: auto;
            transition: transform 0.3s ease-in-out;
        }
        .gallery img:hover {
            transform: scale(1.1);
        }
        .process-button {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            background-color: #007BFF;
            color: white;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .process-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <form action="/process-images" method="post">
            <button type="submit" class="process-button">Sample Other Images</button>
        </form>
    </div>

    <div class="grid-container">
        {% for image in images %}
        <div class="gallery">
            <img src="{{ image }}" alt="Image">
        </div>
        {% endfor %}
    </div>
</body>
</html>
